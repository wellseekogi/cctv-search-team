name: CCTV tests
on:
  pull_request:
    paths: ['src/**', 'tools/**', 'tests/**', 'evaluation/**', 'configs/**', 'data/**', 'fixtures/**', 'requirements.txt', 'pyproject.toml', '.github/workflows/a-sampling.yml']
  push:
    branches: ['feature/a-sampling-bf-integration']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests evaluation/tests src/apps/devtools src/pipeline/b_detection_tracking/tests
