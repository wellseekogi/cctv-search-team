name: A sampling tests
on:
  pull_request:
    paths: ['sampling/**', 'integrations/**', 'tools/**', 'tests/**', 'configs/**', 'fixtures/**', 'requirements-motion.txt', '.github/workflows/a-sampling.yml']
  push:
    branches: ['feature/a-sampling-bf-integration']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-live.txt -r requirements-d.txt
      - run: python -m pytest -q tests evaluation/tests
