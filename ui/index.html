<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTV 영상 검색</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>CCTV 장면 검색</h1>
  <span id="modeBadge" class="badge"></span>
</header>

<main>
  <section id="left" aria-label="검색">
    <div id="ingest" hidden>
      <h2>영상 입력</h2>
      <div class="row">
        <label class="fileButton">영상 구간 올리기<input id="clip" type="file" accept="video/mp4"></label>
      </div>
      <small>MP4 구간당 최대 120초 · 128 MiB</small>
      <small>MEVA 영상 출처: Kitware·IARPA · <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></small>
      <p id="uploadStatus" role="status"></p>
      <ul id="jobs" aria-label="최근 영상 처리 상태"></ul>
    </div>
    <h2>장면에 질문하기</h2>
    <div id="chat" role="log" aria-label="채팅 기록" aria-live="polite"></div>
    <form id="form" novalidate>
      <div id="searchVersions" class="row" hidden>
        <label>검색 버전
          <select id="searchVersion">
            <option value="original">기존</option>
            <option value="b_t8">B 객체 개선</option>
            <option value="pixel">픽셀</option>
          </select>
        </label>
      </div>
      <details><summary>검색 범위</summary>
      <div class="row">
        <label>데이터셋(gallery)
          <select id="gallery">
            <option value="gallery_dev">gallery_dev</option>
          </select>
        </label>
        <label>영상 범위(video_ids)
          <input id="videoIds" type="text" placeholder="비우면 전체. 예: v001, v002" autocomplete="off">
        </label>
      </div>

      </details>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabText" aria-selected="true">텍스트</button>
        <button type="button" role="tab" id="tabImage" aria-selected="false">이미지</button>
      </div>

      <div id="textBox">
        <label>질문
          <input id="text" type="text" placeholder="회색 후드티를 입은 사람이 테이블을 떠나는 장면을 찾아줘" autocomplete="off">
        </label>
      </div>
      <div id="imageBox" hidden>
        <label>참조 이미지 (JPEG·PNG, 5MB 이하, 가로·세로 32px 이상)
          <input id="image" type="file" accept="image/jpeg,image/png">
        </label>
        <img id="imagePreview" alt="" hidden>
      </div>

      <div class="row">
        <label>표현
          <select id="representation">
            <option value="combined">장면과 사람</option>
            <option value="scene">전체 장면</option>
            <option value="object">사람 박스</option>
          </select>
        </label>
        <label>top_k (1~50)
          <input id="topK" type="number" min="1" max="50" value="3">
        </label>
        <button id="submit" type="submit">보내기</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="meta"></div>
    <ol id="results"></ol>
  </section>

  <section id="right" aria-label="원본 재생">
    <h2>원본 영상</h2>
    <div id="stage">
      <video id="video" controls playsinline preload="metadata"></video>
      <canvas id="overlay"></canvas>
      <div id="stageEmpty">결과를 선택하면 원본 영상이 여기에 표시됩니다.</div>
    </div>
    <div id="playerBar">
      <button id="playSegment" type="button" disabled>구간 재생</button>
      <label id="mockFile" hidden>로컬 영상 선택(mock)
        <input id="mockVideo" type="file" accept="video/mp4,video/*">
      </label>
    </div>
    <dl id="info"></dl>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="live.js"></script>
</body>
</html>
