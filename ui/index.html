<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTV 영상 검색</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>CCTV 영상 검색</h1>
  <span id="modeBadge" class="badge"></span>
</header>

<main>
  <section id="left" aria-label="검색">
    <form id="form" novalidate>
      <div class="row">
        <label>데이터셋(gallery)
          <select id="gallery">
            <option value="gallery_dev">gallery_dev</option>
          </select>
        </label>
        <label>영상 범위(video_ids)
          <input id="videoIds" type="text" placeholder="비우면 전체. 예: v001, v002" autocomplete="off">
        </label>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabText" aria-selected="true">텍스트</button>
        <button type="button" role="tab" id="tabImage" aria-selected="false">이미지</button>
      </div>

      <div id="textBox">
        <label>검색어 (영어, 1~500자)
          <input id="text" type="text" placeholder="a white car near an intersection" autocomplete="off">
        </label>
      </div>
      <div id="imageBox" hidden>
        <label>참조 이미지 (JPEG·PNG, 5MB 이하, 가로·세로 32px 이상)
          <input id="image" type="file" accept="image/jpeg,image/png">
        </label>
        <img id="imagePreview" alt="" hidden>
      </div>

      <div class="row">
        <label>표현
          <select id="representation">
            <option value="combined">combined</option>
            <option value="scene">scene</option>
            <option value="object">object</option>
          </select>
        </label>
        <label>top_k (1~50)
          <input id="topK" type="number" min="1" max="50" value="10">
        </label>
        <button id="submit" type="submit">검색</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="meta"></div>
    <ol id="results"></ol>
  </section>

  <section id="right" aria-label="원본 재생">
    <div id="stage">
      <video id="video" controls playsinline preload="metadata"></video>
      <canvas id="overlay"></canvas>
      <div id="stageEmpty">결과를 선택하면 원본 영상이 여기에 표시됩니다.</div>
    </div>
    <div id="playerBar">
      <button id="playSegment" type="button" disabled>구간 재생</button>
      <label id="mockFile" hidden>로컬 영상 선택(mock)
        <input id="mockVideo" type="file" accept="video/mp4,video/*">
      </label>
    </div>
    <dl id="info"></dl>
  </section>
</main>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
